name: App Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/app-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Firma: si existe el secreto PCRT_KEYSTORE (keystore en base64) + PCRT_KEYSTORE_PASS se usa ese,
      # asi los APK nuevos se instalan encima de los viejos. Si no, se firma con una clave temporal
      # (anda, pero para actualizar la app hay que desinstalar la anterior).
      - name: Preparar firma
        env:
          KS: ${{ secrets.PCRT_KEYSTORE }}
          KS_PASS: ${{ secrets.PCRT_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS" ] && [ -n "$KS_PASS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/pcrt.keystore"
            echo "PCRT_KEYSTORE_PASS=$KS_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin secreto PCRT_KEYSTORE: se firma con una clave temporal"
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/pcrt.keystore" -storepass "$PASS" -keypass "$PASS" \
              -alias pcrt -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PCRT, O=Team PCRT, C=AR"
            echo "PCRT_KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
          fi
          echo "PCRT_KEYSTORE_PATH=$RUNNER_TEMP/pcrt.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }}

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pcrt-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # solo desde main: link fijo para bajar siempre la ultima version
      # https://github.com/matiaslardaro/pcrt-dashboard/releases/download/app/pcrt.apk
      - name: Publicar en el release "app"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk pcrt.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "App PCRT" --notes "App de Android del dashboard PCRT. Bajar pcrt.apk e instalar."
          gh release upload app pcrt.apk --clobber
